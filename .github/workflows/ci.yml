name: CI

# Vérifie chaque push et chaque pull request : style, types, tests, build et poids du JavaScript.
on:
  push:
  pull_request:

permissions:
  contents: read

# Un nouveau push annule la vérification en cours de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valeurs factices : le build ne se connecte à aucun vrai service. Les pages qui lisent
      # Supabase ou Impact CO2 se prérendent avec leur message d'erreur, ce qui suffit à vérifier
      # que tout compile et se prérend.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SECRET_KEY: ci-secret-key
      IMPACTCO2_TOKEN: ci-token
      SESSION_SECRET: ci-session-secret-ci-session-secret
      SITE_URL: http://localhost:3000
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_GUILD_ID: ci
      DISCORD_ADMIN_ROLE_ID: ci
      DISCORD_BOT_TOKEN: ci
      DISCORD_ANNOUNCE_CHANNEL_ID: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Poids du JavaScript
        run: npm run size

  e2e:
    name: Tests de bout en bout (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` n'est pas utilisable dans un `if` de job : la vérification se fait plus bas, sur
    # chaque étape (env.IMPACTCO2_TOKEN). Ce `if` évite seulement de lancer le job sur un fork.
    if: github.repository == 'Xoriax/harmony-co2'

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      IMPACTCO2_TOKEN: ${{ secrets.IMPACTCO2_TOKEN }}
      SITE_URL: http://localhost:3100
      # Valeurs factices : les parcours testés (connexion, bilan, export) ne les utilisent pas ;
      # elles évitent seulement une erreur au chargement des pages qui les lisent.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SECRET_KEY: ci-secret-key
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_GUILD_ID: ci
      DISCORD_ADMIN_ROLE_ID: ci
      DISCORD_BOT_TOKEN: ci
      DISCORD_ANNOUNCE_CHANNEL_ID: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium (Playwright)
        # Sans le secret IMPACTCO2_TOKEN (absent sur les forks), on saute la suite plutôt que de
        # bloquer la pull request : les tests de bilan et d'export ont besoin des vraies données
        # d'Impact CO2. Les parcours testés ne touchent ni Discord ni Supabase.
        if: env.IMPACTCO2_TOKEN != ''
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        if: env.IMPACTCO2_TOKEN != ''
        run: npm run e2e

      - name: Rapport Playwright (en cas d'échec)
        if: failure() && env.IMPACTCO2_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
